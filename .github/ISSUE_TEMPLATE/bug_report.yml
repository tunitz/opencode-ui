name: Bug Report
description: Report a reproducible bug in OpenCode UI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Start OpenCode UI with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker (GHCR / Compose)
        - Prebuilt Release Binary
        - Source Checkout (Bun)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit & Engine Version
      description: OpenCode UI release tag or commit SHA, plus OpenCode V2 engine version and OS/browser.
      placeholder: "v0.1.0, OpenCode V2, Linux / Chrome"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any sanitized server or browser console logs (remove tokens, passwords, and private paths).
      render: text
