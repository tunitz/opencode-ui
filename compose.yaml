# OpenCode UI Docker Compose deployment.
# - Host OpenCode engines are reachable via http://host.docker.internal:8090
# - For LAN or Tailscale hostnames, set OPENCODE_UI_ALLOWED_HOSTS and
#   OPENCODE_UI_ALLOWED_ORIGINS in .env (exact values, no wildcards).
services:
  opencode-ui:
    image: ghcr.io/tunitz/opencode-ui:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${OPENCODE_UI_PORT:-5174}:5174"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENCODE_UI_HOST: "0.0.0.0"
      OPENCODE_UI_PORT: "5174"
      OPENCODE_UI_ALLOWED_HOSTS: "${OPENCODE_UI_ALLOWED_HOSTS:-}"
      OPENCODE_UI_ALLOWED_ORIGINS: "${OPENCODE_UI_ALLOWED_ORIGINS:-}"
      OPENCODE_UI_VAPID_SUBJECT: "${OPENCODE_UI_VAPID_SUBJECT:-mailto:opencode-ui@localhost}"
    volumes:
      - opencode-ui-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5174/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  opencode-ui-data:
